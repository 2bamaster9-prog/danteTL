[build-system]
requires = ["hatchling==1.33.0"]
build-backend = "hatchling.build"

[project]
name = "dantejp"
version = "0.1.0"
description = "Local game translation overlay for Windows"
readme = "README.md"
requires-python = ">=3.12,<3.15"
dependencies = [
  "meikiocr==0.3.5",
  "numpy>=2,<=2.3.2",
  "packaging>=24,<27",
  "httpx2==2.16.0",
  "PyJWT[crypto]==2.15.1",
  "opencv-python>=4.10,<6",
  "PySide6-Essentials>=6.8,<7",
  "windows-capture>=2.0.0,<3; sys_platform == 'win32'",
]

[project.gui-scripts]
dantejp = "dantejp.bootstrap:main"

[dependency-groups]
dev = [
    "pytest>=8,<10",
    "pyright>=1.1.400",
    "ruff>=0.12",
    "import-linter==2.10",
]
bundle = ["hatchling==1.33.0", "pyinstaller==6.22.3", "uv==0.13.8", { include-group = "native-build" }]
native-build = ["pip==26.3", "scikit-build-core==1.1.2", "cmake==4.4.5", "ninja==1.13.2", "delvewheel==1.13.2"]
cpu = ["onnxruntime>=1.20,<2"]
# Complete upstream packages: CPU uses the upstream PEP 517 source build; GPU uses wheels.
llm-common = ["diskcache==5.6.3", "jinja2==3.1.6", "Pillow==13.0.0"]
llm-cpu = [{ include-group = "llm-common" }, "llama-cpp-python==0.3.37"]
amd = ["onnxruntime-directml==1.24.4; sys_platform == 'win32'"]
gemma-vulkan = [
  { include-group = "llm-common" },
  "llama-cpp-python @ https://github.com/abetlen/llama-cpp-python/releases/download/v0.3.37-vulkan/llama_cpp_python-0.3.37-py3-none-win_amd64.whl ; sys_platform == 'win32'",
]
cuda = ["nvidia-cuda-runtime==13.0.96", "nvidia-cublas==13.0.2.14"]
gpu = [
  { include-group = "cuda" },
  "onnxruntime-gpu[cuda,cudnn]==1.30.0",
  "nvidia-cudnn-cu13==9.13.1.26",
  "nvidia-cuda-nvrtc==13.0.88",
  "nvidia-nvjitlink==13.0.88",
  "nvidia-cufft==12.0.0.61",
  "nvidia-curand==10.4.0.35",
]
gemma = [
  { include-group = "cuda" },
  { include-group = "llm-common" },
  "llama-cpp-python @ https://github.com/abetlen/llama-cpp-python/releases/download/v0.3.37-cu130/llama_cpp_python-0.3.37-py3-none-win_amd64.whl ; sys_platform == 'win32'",
]

[tool.uv]
default-groups = ["dev", "cpu"]
required-environments = ["sys_platform == 'win32' and platform_machine == 'AMD64'"]
conflicts = [
  [{ group = "cpu" }, { group = "gpu" }, { group = "amd" }],
  [{ group = "llm-cpu" }, { group = "gemma" }, { group = "gemma-vulkan" }],
]
# windows-capture already needs opencv-python, which provides the same cv2 API.
# Installing both OpenCV distributions would overwrite shared package files.
exclude-dependencies = ["opencv-python-headless"]
build-constraint-dependencies = ["scikit-build-core==1.1.2", "cmake==4.4.5", "ninja==1.13.2"]

[tool.uv.audit]
# Required by upstream llama.cpp; its optional pickle cache is never enabled here.
# This exception expires when the advisory lists a fix. See engineering/security.md.
ignore-until-fixed = ["GHSA-w8v5-vhqr-4h9v"]

[tool.uv.config-settings-package.llama-cpp-python]
"cmake.define.GGML_NATIVE" = "OFF"
"cmake.define.GGML_OPENMP" = "OFF"

# Meiki imports the shared onnxruntime namespace. Select exactly one distribution
# via CPU/GPU groups instead of installing overlapping CPU and GPU files together.
[[tool.uv.dependency-metadata]]
name = "meikiocr"
version = "0.3.5"
requires-dist = ["numpy", "opencv-python-headless", "huggingface-hub"]

[tool.hatch.build.targets.wheel]
packages = ["src/dantejp"]

[tool.hatch.build.targets.sdist]
include = ["/src", "/translations", "/tools", "/tests", "/engineering", "/packaging", "/.github", "/README.md", "/AGENTS.md", "/pyproject.toml", "/uv.lock", "/.python-version", "/Run DanteJP.cmd"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pyright]
include = ["src", "tests", "tools"]
pythonVersion = "3.12"
typeCheckingMode = "standard"
strict = ["src/dantejp/application/api.py", "src/dantejp/application/values.py", "src/dantejp/translation/selection.py", "src/dantejp/application/services.py", "src/dantejp/application/translation_activity.py", "src/dantejp/application/capture_lifecycle.py", "src/dantejp/application/presentation.py"]
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = ["windows: requires an interactive Windows desktop and real capture"]

[tool.importlinter]
root_package = "dantejp"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Application and processing owners are independent of Qt and composition"
type = "forbidden"
source_modules = ["dantejp.application", "dantejp.ocr", "dantejp.translation", "dantejp.capture"]
forbidden_modules = ["PySide6", "shiboken6", "dantejp.ui", "dantejp.composition", "dantejp.bootstrap", "dantejp.desktop"]

[[tool.importlinter.contracts]]
name = "Runtime services cannot depend on views or application assembly"
type = "forbidden"
source_modules = ["dantejp.runtime"]
forbidden_modules = ["dantejp.ui", "dantejp.composition", "dantejp.bootstrap", "dantejp.desktop"]

[[tool.importlinter.contracts]]
name = "Status projection depends on values and ports, not resource owners"
type = "forbidden"
source_modules = ["dantejp.application.presentation", "dantejp.application.translation_activity"]
forbidden_modules = ["dantejp.application.session", "dantejp.application.model_lifecycle", "dantejp.application.translation_coordinator", "dantejp.translation.worker", "dantejp.translation.routing", "dantejp.application.live_session", "dantejp.ocr.worker", "dantejp.application.cloud_services", "dantejp.application.setup_coordinator"]

[[tool.importlinter.contracts]]
name = "Views cannot reach backend implementations, credential stores or installers"
type = "forbidden"
source_modules = ["dantejp.ui"]
forbidden_modules = ["dantejp.composition", "dantejp.application.model_factories", "dantejp.runtime.model_store", "dantejp.translation.models.probe", "dantejp.translation.models.gguf", "dantejp.runtime.setup", "dantejp.runtime.first_run", "dantejp.ocr.meiki", "dantejp.translation.backends.gemma", "dantejp.translation.backends.plamo", "dantejp.translation.backends.gguf", "dantejp.translation.cloud.backend", "dantejp.translation.cloud.credentials", "dantejp.translation.cloud.protected_store", "dantejp.application.preferences", "dantejp.translation.worker", "dantejp.ocr.worker", "dantejp.capture.worker", "dantejp.ocr.visual", "dantejp.application.model_inventory", "dantejp.application.model_lifecycle", "dantejp.application.session", "dantejp.application.setup_coordinator", "dantejp.application.cloud_services", "dantejp.runtime.hardware", "dantejp.application.translation_coordinator", "dantejp.application.shutdown", "dantejp.translation.cloud.profiles", "dantejp.translation.cloud.catalog", "dantejp.translation.cloud.chatgpt_auth", "dantejp.translation.cloud.api_connections", "dantejp.translation.routing", "dantejp.translation.dialogue.classifier", "dantejp.runtime.owned_process", "dantejp.runtime.restart", "dantejp.runtime.application", "dantejp.runtime.downloads", "dantejp.runtime.probe", "dantejp.runtime.setup_process"]
