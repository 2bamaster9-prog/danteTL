[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "jp-overlay"
version = "0.1.0"
description = "Local game translation overlay for Windows"
readme = "README.md"
requires-python = ">=3.12,<3.15"
dependencies = [
  "ctranslate2>=4.6,<5",
  "sentencepiece>=0.2,<0.3",
  "meikiocr==0.3.5",
  "numpy>=2,<3",
  "opencv-python>=4.10,<6",
  "PySide6-Essentials>=6.8,<7",
  "windows-capture>=2.0.0,<3; sys_platform == 'win32'",
]

[project.gui-scripts]
jp-overlay = "jp_overlay.app:main"

[dependency-groups]
dev = ["pytest>=8,<10", "pyright>=1.1.400", "ruff>=0.12"]
cpu = ["onnxruntime>=1.20,<2"]
amd = ["onnxruntime-directml==1.24.4; sys_platform == 'win32'"]
gemma-vulkan = ["llama-cpp-python @ https://github.com/abetlen/llama-cpp-python/releases/download/v0.3.36-vulkan/llama_cpp_python-0.3.36-py3-none-win_amd64.whl ; sys_platform == 'win32' and platform_machine == 'AMD64'"]
gpu = [
  "onnxruntime-gpu[cuda,cudnn]==1.26.0",
  "nvidia-cublas-cu12==12.9.2.10",
  "nvidia-cudnn-cu12==9.10.2.21",
]
gemma = [
  "llama-cpp-python @ https://github.com/abetlen/llama-cpp-python/releases/download/v0.3.36-cu130/llama_cpp_python-0.3.36-py3-none-win_amd64.whl ; sys_platform == 'win32' and platform_machine == 'AMD64'",
  "nvidia-cuda-runtime==13.0.96; sys_platform == 'win32' and platform_machine == 'AMD64'",
  "nvidia-cublas==13.0.2.14; sys_platform == 'win32' and platform_machine == 'AMD64'",
]

[tool.uv]
default-groups = ["dev", "cpu"]
required-environments = ["sys_platform == 'win32' and platform_machine == 'AMD64'"]
conflicts = [
  [{ group = "cpu" }, { group = "gpu" }, { group = "amd" }],
  [{ group = "gemma" }, { group = "gemma-vulkan" }],
]
# windows-capture already needs opencv-python, which provides the same cv2 API.
# Installing both OpenCV distributions would overwrite shared package files.
exclude-dependencies = ["opencv-python-headless"]

# Meiki imports the shared onnxruntime namespace. Select exactly one distribution
# via CPU/GPU groups instead of installing overlapping CPU and GPU files together.
[[tool.uv.dependency-metadata]]
name = "meikiocr"
version = "0.3.5"
requires-dist = ["numpy", "opencv-python-headless", "huggingface-hub"]

[tool.hatch.build.targets.wheel]
packages = ["src/jp_overlay"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pyright]
include = ["src", "tests", "tools"]
pythonVersion = "3.12"
typeCheckingMode = "standard"
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = ["windows: requires an interactive Windows desktop and real capture"]
