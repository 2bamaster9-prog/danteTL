[build-system]
requires = ["hatchling==1.33.0"]
build-backend = "hatchling.build"

[project]
name = "jp-overlay"
version = "0.1.0"
description = "Local game translation overlay for Windows"
readme = "README.md"
requires-python = ">=3.12,<3.15"
dependencies = [
  "meikiocr==0.3.5",
  "numpy>=2,<=2.3.2",
  "packaging>=24,<27",
  "httpx2==2.16.0",
  "PyJWT[crypto]==2.10.1",
  "opencv-python>=4.10,<6",
  "PySide6-Essentials>=6.8,<7",
  "windows-capture>=2.0.0,<3; sys_platform == 'win32'",
]

[project.gui-scripts]
jp-overlay = "jp_overlay.app:main"

[dependency-groups]
dev = [
    "pytest>=8,<10",
    "pyright>=1.1.400",
    "ruff>=0.12",
    "import-linter==2.10",
]
bundle = ["hatchling==1.33.0", "pyinstaller==6.22.3", "uv==0.13.8", { include-group = "native-build" }]
native-build = ["pip==26.3", "scikit-build-core==1.1.2", "cmake==4.4.5", "ninja==1.13.2", "delvewheel==1.13.2"]
cpu = ["onnxruntime>=1.20,<2"]
# Complete upstream packages: CPU uses the upstream PEP 517 source build; GPU uses wheels.
llm-common = ["diskcache==5.6.3", "jinja2==3.1.6", "Pillow==13.0.0"]
llm-cpu = [{ include-group = "llm-common" }, "llama-cpp-python==0.3.37"]
amd = ["onnxruntime-directml==1.24.4; sys_platform == 'win32'"]
gemma-vulkan = [
  { include-group = "llm-common" },
  "llama-cpp-python @ https://github.com/abetlen/llama-cpp-python/releases/download/v0.3.37-vulkan/llama_cpp_python-0.3.37-py3-none-win_amd64.whl ; sys_platform == 'win32'",
]
cuda = ["nvidia-cuda-runtime==13.0.96", "nvidia-cublas==13.0.2.14"]
gpu = [
  { include-group = "cuda" },
  "onnxruntime-gpu[cuda,cudnn]==1.30.0",
  "nvidia-cudnn-cu13==9.13.1.26",
  "nvidia-cuda-nvrtc==13.0.88",
  "nvidia-nvjitlink==13.0.88",
  "nvidia-cufft==12.0.0.61",
  "nvidia-curand==10.4.0.35",
]
gemma = [
  { include-group = "cuda" },
  { include-group = "llm-common" },
  "llama-cpp-python @ https://github.com/abetlen/llama-cpp-python/releases/download/v0.3.37-cu130/llama_cpp_python-0.3.37-py3-none-win_amd64.whl ; sys_platform == 'win32'",
]

[tool.uv]
default-groups = ["dev", "cpu"]
required-environments = ["sys_platform == 'win32' and platform_machine == 'AMD64'"]
conflicts = [
  [{ group = "cpu" }, { group = "gpu" }, { group = "amd" }],
  [{ group = "llm-cpu" }, { group = "gemma" }, { group = "gemma-vulkan" }],
]
# windows-capture already needs opencv-python, which provides the same cv2 API.
# Installing both OpenCV distributions would overwrite shared package files.
exclude-dependencies = ["opencv-python-headless"]
build-constraint-dependencies = ["scikit-build-core==1.1.2", "cmake==4.4.5", "ninja==1.13.2"]

[tool.uv.config-settings-package.llama-cpp-python]
"cmake.define.GGML_NATIVE" = "OFF"
"cmake.define.GGML_OPENMP" = "OFF"

# Meiki imports the shared onnxruntime namespace. Select exactly one distribution
# via CPU/GPU groups instead of installing overlapping CPU and GPU files together.
[[tool.uv.dependency-metadata]]
name = "meikiocr"
version = "0.3.5"
requires-dist = ["numpy", "opencv-python-headless", "huggingface-hub"]

[tool.hatch.build.targets.wheel]
packages = ["src/jp_overlay"]

[tool.hatch.build.targets.sdist]
include = ["/src", "/tools", "/tests", "/engineering", "/packaging", "/.github", "/README.md", "/AGENTS.md", "/pyproject.toml", "/uv.lock", "/.python-version", "/Run DanteJP.cmd"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pyright]
include = ["src", "tests", "tools"]
pythonVersion = "3.12"
typeCheckingMode = "standard"
strict = ["src/jp_overlay/application_api.py", "src/jp_overlay/application_values.py", "src/jp_overlay/model_selection.py", "src/jp_overlay/view_services.py", "src/jp_overlay/translation_activity.py", "src/jp_overlay/capture_lifecycle.py", "src/jp_overlay/application_presentation.py"]
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = ["windows: requires an interactive Windows desktop and real capture"]

[tool.importlinter]
root_package = "jp_overlay"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Application and processing owners are independent of Qt and composition"
type = "forbidden"
source_modules = ["jp_overlay.capture_lifecycle", "jp_overlay.translation_activity", "jp_overlay.application_presentation", "jp_overlay.application_session", "jp_overlay.translation_coordinator", "jp_overlay.cloud_services", "jp_overlay.setup_coordinator", "jp_overlay.model_inventory", "jp_overlay.live_session", "jp_overlay.shutdown", "jp_overlay.grouping", "jp_overlay.tracking", "jp_overlay.visual"]
forbidden_modules = ["PySide6", "shiboken6", "jp_overlay.ui", "jp_overlay.settings_window", "jp_overlay.composition", "jp_overlay.app", "jp_overlay.desktop_driver"]

[[tool.importlinter.contracts]]
name = "Status projection depends on values and ports, not resource owners"
type = "forbidden"
source_modules = ["jp_overlay.application_presentation", "jp_overlay.translation_activity"]
forbidden_modules = ["jp_overlay.application_session", "jp_overlay.model_lifecycle", "jp_overlay.translation_coordinator", "jp_overlay.translation", "jp_overlay.translation_routing", "jp_overlay.live_session", "jp_overlay.recognition", "jp_overlay.cloud_services", "jp_overlay.setup_coordinator"]

[[tool.importlinter.contracts]]
name = "Views cannot reach backend implementations, credential stores or installers"
type = "forbidden"
source_modules = ["jp_overlay.ui", "jp_overlay.settings_window", "jp_overlay.cloud_settings", "jp_overlay.cloud_editor", "jp_overlay.model_manager", "jp_overlay.model_import_dialog", "jp_overlay.runtime_dialog", "jp_overlay.setup_assistant", "jp_overlay.routing_controls", "jp_overlay.history_panel"]
forbidden_modules = ["jp_overlay.composition", "jp_overlay.model_factories", "jp_overlay.model_store", "jp_overlay.gguf_probe", "jp_overlay.gguf_models", "jp_overlay.runtime_setup", "jp_overlay.first_run", "jp_overlay.meiki", "jp_overlay.gemma", "jp_overlay.plamo", "jp_overlay.gguf_backend", "jp_overlay.cloud", "jp_overlay.credentials", "jp_overlay.protected_store", "jp_overlay.preferences", "jp_overlay.translation", "jp_overlay.recognition", "jp_overlay.capture", "jp_overlay.visual", "jp_overlay.model_inventory", "jp_overlay.model_lifecycle", "jp_overlay.application_session", "jp_overlay.setup_coordinator", "jp_overlay.cloud_services", "jp_overlay.hardware", "jp_overlay.translation_coordinator", "jp_overlay.shutdown", "jp_overlay.cloud_profiles", "jp_overlay.cloud_catalog", "jp_overlay.chatgpt_auth", "jp_overlay.api_connections", "jp_overlay.translation_routing", "jp_overlay.dialogue_classifier", "jp_overlay.owned_process", "jp_overlay.runtime_restart", "jp_overlay.runtime_application", "jp_overlay.runtime_downloads", "jp_overlay.runtime_probe", "jp_overlay.setup_process"]
